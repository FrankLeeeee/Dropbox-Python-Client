<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-label="dbx logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7CF6"/>
      <stop offset="1" stop-color="#0B4DB8"/>
    </linearGradient>
  </defs>

  <!-- mark: rounded box -->
  <rect x="16" y="16" width="128" height="128" rx="28" fill="url(#g)"/>

  <!-- folder tab -->
  <path d="M44 62 h20 l8 -10 h44 a6 6 0 0 1 6 6 v4 H44 z" fill="#ffffff" fill-opacity="0.35"/>
  <!-- folder body -->
  <rect x="40" y="62" width="88" height="50" rx="8" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="3"/>

  <!-- upload arrow -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 100 V74"/>
    <path d="M54 84 L64 74 L74 84"/>
  </g>
  <!-- download arrow -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M104 74 V100"/>
    <path d="M94 90 L104 100 L114 90"/>
  </g>

  <!-- wordmark -->
  <text x="176" y="98" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#1F2937" letter-spacing="-2">dbx</text>
  <text x="178" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#6B7280" letter-spacing="2">DROPBOX PYTHON CLIENT</text>
</svg>
